name: unified-ai-governance-security

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  environment: &api-env
    DATABASE_URL: postgresql+psycopg://uag_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/uag
    REDIS_URL: redis://redis:6379/0
    EXECUTION_MODE: redis
    CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3100,http://localhost:3100}
    ENVIRONMENT: ${ENVIRONMENT:-development}
    OPA_URL: http://opa:8181
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 1g
  cpus: 2
  pids_limit: 128
  networks: [internal, edge]

services:
  opa:
    image: openpolicyagent/opa@sha256:12cecac5a174368f7d3f09d3a19d040ebe0c91d576e520335ae7a985a26e39d3
    command: [run, --server, --addr=0.0.0.0:8181, /policies/governance.rego]
    volumes: [./integrations/policies/governance.rego:/policies/governance.rego:ro]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]
    mem_limit: 256m
  postgres:
    image: postgres@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    environment:
      POSTGRES_USER: uag_owner
      POSTGRES_DB: uag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-uag.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U uag_owner -d uag]
      interval: 5s
      retries: 20
    networks: [internal]
    mem_limit: 768m
  redis:
    image: redis@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
    networks: [internal]
    mem_limit: 256m
  migrate:
    <<: *backend
    networks: [internal]
    environment:
      <<: *api-env
      DATABASE_URL: postgresql+psycopg://uag_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/uag
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    command: [python, -m, uvicorn, uag.main:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    ports: ["127.0.0.1:8100:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    <<: *backend
    networks: [internal]
    command: [python, -m, uag.cli, worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8100/api/v1}
    ports: ["127.0.0.1:3100:3000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
networks:
  internal: {internal: true}
  edge: {}
