name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.3'}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: npm ci --ignore-scripts --omit=optional
        working-directory: integrations/tooling
      - run: pytest -q -ra
        env: {UAG_TEST_CDXGEN: '1', UAG_SCAN_TMP_ROOT: /tmp}
      - run: python scripts/build_register.py && git diff --exit-code INTEGRATION_REGISTER.md LICENCE_AUDIT.md THIRD_PARTY_NOTICES.md integrations/catalog.json
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.lock
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.3', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test -- --run && npm run typecheck && npm run format:check && npm run build && npm audit --audit-level=high
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.presidio.yml:docker-compose.signing.yml
      UAG_RELEASE_CREDENTIALS: tmp/release-service-credentials.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.3'}
      - name: Generate isolated CI credentials
        run: |
          python - <<'PY'
          import json,os,secrets
          from pathlib import Path
          values={key:secrets.token_hex(24) for key in ['POSTGRES_PASSWORD','APP_DB_PASSWORD','E2E_PASSWORD','SERVICE_PASSWORD']}
          for key,value in values.items():
              print('::add-mask::'+value)
              with open(os.environ['GITHUB_ENV'],'a') as env: env.write(key+'='+value+'\n')
          Path('tmp').mkdir(exist_ok=True)
          Path('secrets').mkdir(exist_ok=True)
          Path('tmp/release-browser-credentials.json').write_text(json.dumps({'email':'browser@test.invalid','password':values['E2E_PASSWORD']}))
          Path('tmp/release-service-credentials.json').write_text(json.dumps({'email':'operations@test.invalid','password':values['SERVICE_PASSWORD']}))
          PY
      - run: docker compose config --quiet && docker compose build
      - name: Provision private signing key
        run: |
          docker compose run --rm --no-deps --user 0 -v "$PWD/secrets:/keys" migrate python -m uag.cli keygen --path /keys/evidence-signing.pem
          sudo chown 10001:10001 secrets/evidence-signing.pem
          sudo chmod 600 secrets/evidence-signing.pem
      - run: docker compose up -d --wait api frontend worker opa presidio
      - name: Provision isolated browser tenant
        run: docker compose exec -T -e UAG_BOOTSTRAP_PASSWORD="$E2E_PASSWORD" api python -m uag.cli bootstrap --email browser@test.invalid --tenant "CI browser workspace"
      - name: Provision isolated service-verification tenant
        run: docker compose exec -T -e UAG_BOOTSTRAP_PASSWORD="$SERVICE_PASSWORD" api python -m uag.cli bootstrap --email operations@test.invalid --tenant "CI service verification"
      - run: python scripts/release_checks.py backend-services
      - run: pip install httpx==0.28.1
      - run: python scripts/verify_compose.py --workflow-only
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/release_checks.py browser
      - run: python scripts/verify_recovery.py
      - run: python scripts/release_benchmark.py
      - name: Preserve service verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-verification
          path: |
            docs/release/backend-services.txt
            docs/release/browser.txt
            docs/release/compose-workflow-v0.2.json
            docs/release/recovery.json
            docs/release/benchmark-v0.2.json
      - if: always()
        run: docker compose logs --no-color && docker compose down
