name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 inspected 2026-11-13
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24'}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: npm ci --ignore-scripts --omit=optional
        working-directory: integrations/tooling
      - run: pytest -q
        env: {UAG_TEST_CDXGEN: '1'}
      - run: python scripts/build_register.py && git diff --exit-code INTEGRATION_REGISTER.md LICENCE_AUDIT.md THIRD_PARTY_NOTICES.md
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.lock
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test -- --run && npm run typecheck && npm run format:check && npm run build && npm audit --audit-level=high
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate isolated CI database credentials
        run: |
          owner_password=$(openssl rand -hex 24)
          app_password=$(openssl rand -hex 24)
          browser_password=$(openssl rand -hex 24)
          echo "::add-mask::$owner_password"
          echo "::add-mask::$app_password"
          echo "::add-mask::$browser_password"
          echo "POSTGRES_PASSWORD=$owner_password" >> "$GITHUB_ENV"
          echo "APP_DB_PASSWORD=$app_password" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$browser_password" >> "$GITHUB_ENV"
      - run: docker compose config --quiet && docker compose build && docker compose up -d --wait api frontend worker opa
      - run: curl --fail http://127.0.0.1:8100/health && curl --fail http://127.0.0.1:3100/
      - name: Provision isolated browser test tenant
        run: docker compose exec -T -e UAG_BOOTSTRAP_PASSWORD="$E2E_PASSWORD" api python -m uag.cli bootstrap --email browser@test.invalid --tenant "CI browser workspace"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
        env:
          E2E_EMAIL: browser@test.invalid
          E2E_BASE_URL: http://127.0.0.1:3100
      - if: always()
        run: docker compose logs --no-color && docker compose down
