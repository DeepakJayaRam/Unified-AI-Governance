[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-ai-governance-security"
version = "0.2.0"
description = "Independent multi-tenant AI governance and security engine"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.162.5", "pydantic==2.14.3", "sqlalchemy==2.1.8",
  "alembic==1.20.1", "uvicorn==0.54.0", "redis==8.1.0",
  "httpx==0.28.1", "argon2-cffi==25.1.0", "cryptography==50.0.2",
  "psycopg[binary]==3.3.9", "compliance-trestle==5.2.1", "defusedxml==0.7.1"
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
uag = "uag.cli:main"

[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["uag*", "integrations*"]
namespaces = false

[tool.setuptools.package-data]
integrations = ["catalog.json", "policies/*.rego"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
